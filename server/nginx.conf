# Bao Teck Tea House — nginx configuration.
# Only needed if your host uses nginx instead of Apache.
server {
    listen 80;
    server_name baoteckteahouse.com www.baoteckteahouse.com;
    root /var/www/baoteck;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location /admin/ { deny all; return 403; }

    location ~* \.(jpg|jpeg|png|svg|webp|ico)$ { expires 6M; add_header Cache-Control "public"; }
    location ~* \.(css|js)$                    { expires 7d; add_header Cache-Control "public"; }
    location ~* \.json$                        { expires -1; add_header Cache-Control "no-cache"; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ /index.html; }
}

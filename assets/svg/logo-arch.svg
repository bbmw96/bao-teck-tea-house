<!--
  BAO TECK TEA HOUSE - the carved arch above the door, redrawn.

  Taken from the photograph of the shopfront plaque:
    - Five medallions on a carved arc. Read right to left in the Chinese
      manner, the three central ones give the name: BAO TECK GUAN.
    - The two smaller outer medallions carry the two characters for
      Penang, framing the name.
    - Two vertical inscriptions flank the arch. They are a traditional
      pair of merchant pledges: genuine goods at honest prices, and
      never cheating anyone, young or old.
    - The Latin wordmark sits beneath.

  Every Chinese character below is a VECTOR PATH, not text. That means
  the logo looks identical on every device, whether or not a Chinese
  font is installed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"
     role="img" aria-labelledby="archTitle archDesc" class="logo-arch">
  <title id="archTitle">Bao Teck Tea House, Penang</title>
  <desc id="archDesc">The carved arch above the door of the tea house, showing the name in Chinese framed by the two characters for Penang, with the traditional merchant pledges carved either side.</desc>


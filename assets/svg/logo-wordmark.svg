<!-- ==========================================================================
     THE SHOP NAME, SET IN TYPE
     包德館 in Traditional characters, to match the carved sign over the door.

     This is deliberately NOT a designed emblem. Until the shop provides its
     own logo file, the website shows the shop's name and nothing more: no
     invented arch, no invented seal, no invented monogram.

     TO USE THE REAL LOGO: save the shop's own file into
     01-WEBSITE/images/brand/ and follow GUIDE 6. Nothing here needs editing.

     The characters are drawn as vector outlines, so they render identically
     everywhere and never depend on a Chinese font being installed.
     Colour follows the surrounding text, so it themes automatically.
     ========================================================================== -->

<body data-room="reserve">

<div class="loader" role="status" aria-live="polite">
  <span class="visually-hidden" data-i18n="common.loading">Loading</span>
  <div class="loader__panel loader__panel--l" aria-hidden="true"></div>
  <div class="loader__panel loader__panel--r" aria-hidden="true"></div>
  <div class="loader__arch" aria-hidden="true">
    <img src="../assets/svg/logo-wordmark-gilt.svg" alt="" width="332" height="104">
  </div>
</div>

<div class="grain" aria-hidden="true"></div>
<div class="scroll-progress" aria-hidden="true"></div>
<a class="skip-link" href="#main" data-i18n="nav.skipToContent">Skip to main content</a>
<header class="site-header" data-site-header></header>

<div data-scroll-root>
<main id="main">

  <section class="section room-hero room-hero--plain" data-steam-field>
    <div class="tiles" aria-hidden="true"></div>
    <div class="wrap">
      <div class="section-head section-head--center reveal">
        <p class="room-hero__cn" lang="zh-Hant" aria-hidden="true">訂</p>
        <p class="eyebrow" style="justify-content:center" data-i18n="reserve.hero.eyebrow"></p>
        <h1 data-split data-i18n="reserve.hero.title"></h1>
        <p class="lead" style="margin-inline:auto" data-i18n="reserve.hero.lead"></p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-block-start:0">
    <div class="wrap-narrow">
      <div class="grid grid-2 reveal-child">

        <article class="feature" data-tilt="4" style="min-block-size:auto">
          <span class="feature__num" aria-hidden="true" style="display:inline-flex;line-height:0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="34" height="34"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <p class="eyebrow" data-i18n="common.whatsapp"></p>
          <h3 style="font-size:var(--step-2)" data-i18n="reserve.choice.whatsapp.title"></h3>
          <p class="text-muted" style="margin-block:var(--space-2xs) var(--space-m)" data-i18n="reserve.choice.whatsapp.body"></p>
          <p><a class="btn btn--whatsapp" data-reserve-whatsapp-link href="#" data-magnetic="0.28"><span data-i18n="reserve.choice.whatsapp.cta"></span></a></p>
        </article>

        <article class="feature" data-tilt="4" style="min-block-size:auto">
          <span class="feature__num" aria-hidden="true" style="display:inline-flex;line-height:0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="34" height="34"><path d="M8 3h8l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M15 3v5h5"/><path d="M9 13h6M9 17h6M9 9h2"/></svg>
          </span>
          <p class="eyebrow" data-i18n="reserve.form.eyebrow"></p>
          <h3 style="font-size:var(--step-2)" data-i18n="reserve.choice.form.title"></h3>
          <p class="text-muted" style="margin-block:var(--space-2xs) var(--space-m)" data-i18n="reserve.choice.form.body"></p>
          <p><a class="btn btn--accent" href="#reservation-form" data-magnetic="0.28"><span data-i18n="reserve.choice.form.cta"></span></a></p>
        </article>

      </div>
    </div>
  </section>

  <div class="threshold threshold--thin" aria-hidden="true"></div>

  <section class="section section--alt" id="reservation-form">
    <div class="wrap-narrow">
      <div class="section-head reveal">
        <p class="eyebrow" data-i18n="reserve.form.eyebrow"></p>
        <h2 data-split data-i18n="reserve.form.title"></h2>
      </div>

      <div class="notice reveal" style="margin-block-end:var(--space-l)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.6"/></svg>
        <p data-i18n="reserve.form.note" style="max-inline-size:none"></p>
      </div>

      <form class="reveal stack" style="--flow:var(--space-m)" data-reservation-form novalidate>
        <div class="grid grid-2" style="gap:var(--space-m)">
          <div class="field">
            <label for="res-name" data-i18n="reserve.form.name"></label>
            <input class="input" type="text" id="res-name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="res-phone" data-i18n="reserve.form.phone"></label>
            <input class="input" type="tel" id="res-phone" name="phone" autocomplete="tel" dir="ltr" required>
          </div>
        </div>

        <div class="grid grid-3" style="gap:var(--space-m)">
          <div class="field">
            <label for="res-party" data-i18n="reserve.form.party"></label>
            <input class="input" type="number" id="res-party" name="party" min="1" max="60" step="1" inputmode="numeric" required>
          </div>
          <div class="field">
            <label for="res-date" data-i18n="reserve.form.date"></label>
            <input class="input" type="date" id="res-date" name="date" required>
          </div>
          <div class="field">
            <label for="res-time" data-i18n="reserve.form.time"></label>
            <input class="input" type="time" id="res-time" name="time" required>
          </div>
        </div>

        <div class="field">
          <label for="res-notes" data-i18n="reserve.form.notes"></label>
          <textarea class="textarea" id="res-notes" name="notes"></textarea>
          <span class="hint" data-i18n="reserve.form.notesHint"></span>
        </div>

        <p class="error-text" data-reserve-error hidden></p>
        <p class="text-sm" role="status" aria-live="polite" data-reserve-status></p>

        <p>
          <button class="btn btn--accent btn--lg" type="submit" data-reserve-submit data-magnetic="0.25">
            <span data-i18n="reserve.form.submit"></span>
          </button>
        </p>
      </form>
    </div>
  </section>

</main>
<footer class="site-footer" data-site-footer></footer>
</div>

<button class="icon-btn to-top" type="button" data-i18n-aria-label="nav.backToTop">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

</body>
</html>

<body data-room="tea">

<div class="loader" role="status" aria-live="polite">
  <span class="visually-hidden" data-i18n="common.loading">Loading</span>
  <div class="loader__panel loader__panel--l" aria-hidden="true"></div>
  <div class="loader__panel loader__panel--r" aria-hidden="true"></div>
  <div class="loader__arch" aria-hidden="true">
    <img src="../assets/svg/logo-wordmark-gilt.svg" alt="" width="332" height="104">
  </div>
</div>

<div class="grain" aria-hidden="true"></div>
<div class="scroll-progress" aria-hidden="true"></div>
<a class="skip-link" href="#main" data-i18n="nav.skipToContent">Skip to main content</a>
<header class="site-header" data-site-header></header>

<div data-scroll-root>
<main id="main">

  <section class="room-hero" data-steam-field>
    <div class="tiles" aria-hidden="true"></div>
    <div class="wrap">
      <div class="room-hero__grid">
        <div class="reveal stack" style="--flow:var(--space-m)">
          <p class="room-hero__cn" lang="zh-Hant" aria-hidden="true">茶壺</p>
          <p class="eyebrow" data-i18n="tea.hero.eyebrow"></p>
          <h1 data-split data-i18n="tea.hero.title"></h1>
          <p class="lead" data-i18n="tea.hero.lead"></p>
        </div>
        <div class="room-hero__art">
          <div class="frame" data-reveal-image style="aspect-ratio:5/4">
          <div class="art-placeholder" aria-hidden="true"><span>茶</span></div>
          <img src="../images/hero/hero-tea.jpg" alt="" data-i18n-alt="tea.hero.title" data-glyph="茶"
               loading="lazy" decoding="async" width="1000" height="1250">
        </div>
          <span class="seal" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ THE POUR: the page steeps as you scroll ═══ -->
  <section class="steep" data-steep-zone style="min-block-size:170svh;position:relative">
    <div class="steep__sticky">
      <div class="wrap-narrow" style="text-align:center">
        <div class="pot" data-steep-pot>
          <div class="pot__steam" aria-hidden="true"></div>
          <div class="pot__spout" aria-hidden="true"></div>
          <div class="pot__handle" aria-hidden="true"></div>
          <div class="pot__lid" aria-hidden="true"></div>
          <div class="pot__body" aria-hidden="true"><div class="pot__fill"></div></div>
        </div>
        <!-- The pour counter. The numeral and its caption are decorative, so
             they are hidden from screen readers; the sentence beneath is what
             gets read out instead, and it is announced politely as it changes. -->
        <p class="steep__count">
          <span data-steep-label aria-hidden="true">1</span>
          <small data-i18n="tea.pours.label" aria-hidden="true"></small>
          <span class="visually-hidden" data-steep-announce role="status" aria-live="polite"></span>
        </p>
        <h2 style="margin-block-start:var(--space-l)" data-i18n="tea.intro.title"></h2>
        <p class="lead" style="margin-inline:auto;margin-block-start:var(--space-m)" data-i18n="tea.intro.body"></p>
        <p style="margin-block-start:var(--space-m)" data-i18n="tea.intro.body2"></p>
      </div>
    </div>
  </section>

  <div class="threshold threshold--thin" aria-hidden="true"></div>

  <section class="section">
    <div class="wrap-narrow">
      <div class="section-head reveal">
        <p class="eyebrow" data-i18n="tea.chinese.title"></p>
        <h2 data-split data-i18n="tea.chinese.title"></h2>
        <p class="lead" data-i18n="tea.chinese.lead"></p>
      </div>
      <div class="reveal" data-tea-list="chinese"></div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap-narrow">
      <div class="section-head reveal">
        <p class="eyebrow" data-i18n="tea.english.title"></p>
        <h2 data-split data-i18n="tea.english.title"></h2>
        <p class="lead" data-i18n="tea.english.lead"></p>
      </div>
      <div class="reveal" data-tea-list="english"></div>
    </div>
  </section>

  <section class="section section--dark">
    <div class="airbrick-bg" aria-hidden="true"></div>
    <div class="wrap-narrow" style="text-align:center">
      <div class="reveal stack" style="--flow:var(--space-m)">
        <h2 data-split data-i18n="tea.byo.title"></h2>
        <p class="lead" style="margin-inline:auto" data-i18n="tea.byo.body"></p>
        <p style="font-size:var(--step-3);font-family:var(--font-display);color:var(--accent-glow)">
          <span data-i18n="tea.byo.fee"></span>
          <span data-byo-fee dir="ltr" style="margin-inline-start:.5em"></span>
        </p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="split-grid split-grid--center">
        <div><div class="frame" data-reveal-image style="aspect-ratio:4/3">
          <div class="art-placeholder" aria-hidden="true"><span>壺</span></div>
          <img src="../images/tea/tea-ritual.jpg" alt="" data-i18n-alt="gallery.items.pouring" data-glyph="壺"
               loading="lazy" decoding="async" width="1000" height="1250">
        </div></div>
        <div class="reveal reveal--right stack" style="--flow:var(--space-m)">
          <p class="eyebrow" data-i18n="home.highTea.eyebrow"></p>
          <h2 data-split data-i18n="home.highTea.title"></h2>
          <p class="lead" data-i18n="home.highTea.body"></p>
          <p class="cluster">
            <a class="btn" href="menu.html" data-magnetic="0.28" data-i18n="common.viewMenu"></a>
            <a class="btn btn--ghost" href="reserve.html" data-magnetic="0.28" data-i18n="common.bookTable"></a>
          </p>
        </div>
      </div>
    </div>
  </section>

</main>
<footer class="site-footer" data-site-footer></footer>
</div>

<button class="icon-btn to-top" type="button" data-i18n-aria-label="nav.backToTop">

</button>

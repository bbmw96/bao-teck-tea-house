<body data-room="story">

<div class="loader" role="status" aria-live="polite">
  <span class="visually-hidden" data-i18n="common.loading">Loading</span>
  <div class="loader__panel loader__panel--l" aria-hidden="true"></div>
  <div class="loader__panel loader__panel--r" aria-hidden="true"></div>

  </div>
</div>

<div class="grain" aria-hidden="true"></div>

<header class="site-header" data-site-header></header>

<div data-scroll-root>
<main id="main">

  <section class="room-hero" data-steam-field>
    <div class="tiles" aria-hidden="true"></div>
    <div class="wrap">
      <div class="room-hero__grid">
        <div class="reveal stack" style="--flow:var(--space-m)">
          <p class="room-hero__cn" lang="zh-Hant" aria-hidden="true">天井</p>
          <p class="eyebrow" data-i18n="story.hero.eyebrow"></p>
          <h1 data-split data-i18n="story.hero.title"></h1>
          <p class="lead" data-i18n="story.hero.lead"></p>
        </div>
        <div class="room-hero__art">
          <div class="frame" data-reveal-image style="aspect-ratio:5/4">
          <div class="art-placeholder" aria-hidden="true"><span>德</span></div>
          <img src="../images/hero/hero-story.jpg" alt="" data-i18n-alt="story.hero.title" data-glyph="德"
               loading="lazy" decoding="async" width="1000" height="1250">
        </div>
          <span class="seal" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ THE SIGN ABOVE THE DOOR ═══ -->
  <section class="section section--dark">
    <div class="airbrick-bg" aria-hidden="true"></div>
    <div class="wrap">
      <div class="sign-arch reveal reveal--scale">
        <img src="../assets/svg/logo-wordmark-gilt.svg" alt="" width="332" height="104" loading="lazy">
      </div>
      <div class="split-grid" style="margin-block-start:var(--space-2xl)">
        <div class="reveal reveal--left stack" style="--flow:var(--space-m)">
          <p class="eyebrow" data-i18n="story.sign.eyebrow"></p>
          <h2 data-split data-i18n="story.sign.title"></h2>
          <p class="lead" data-i18n="story.sign.body"></p>
        </div>
        <div class="reveal reveal--right stack" style="--flow:var(--space-m)">
          <p class="eyebrow" data-i18n="story.motto.eyebrow"></p>
          <h2 data-i18n="story.motto.title"></h2>
          <p data-i18n="story.motto.body"></p>
          <div class="motto-pair">
            <div class="motto-card">
              <p class="motto-cn" data-motto-right lang="zh-Hant"></p>
              <p class="text-sm" data-i18n="story.motto.rightGloss"></p>
            </div>
            <div class="motto-card">
              <p class="motto-cn" data-motto-left lang="zh-Hant"></p>
              <p class="text-sm" data-i18n="story.motto.leftGloss"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ THE AIRWELL: the timeline descends through the light ═══ -->
  <section class="section airwell">
    <div class="airwell__shaft" aria-hidden="true"></div>
    <div class="airwell__dust" aria-hidden="true"></div>
    <div class="wrap-narrow" style="position:relative;z-index:2">
      <div class="section-head section-head--center reveal">
        <p class="eyebrow" style="justify-content:center" data-i18n="story.origins.eyebrow"></p>
        <h2 data-split data-i18n="story.timeline.title"></h2>
      </div>
      <div class="timeline">
        <div class="timeline__item">
          <p class="timeline__year" data-i18n="story.timeline.items.silk.year"></p>
          <h3 style="margin-block:var(--space-2xs)" data-i18n="story.timeline.items.silk.title"></h3>
          <p class="text-muted" data-i18n="story.timeline.items.silk.text"></p>
        </div>
        <div class="timeline__item">
          <p class="timeline__year" data-i18n="story.timeline.items.penang.year"></p>
          <h3 style="margin-block:var(--space-2xs)" data-i18n="story.timeline.items.penang.title"></h3>
          <p class="text-muted" data-i18n="story.timeline.items.penang.text"></p>
        </div>
        <div class="timeline__item">
          <p class="timeline__year" data-i18n="story.timeline.items.shophouse.year"></p>
          <h3 style="margin-block:var(--space-2xs)" data-i18n="story.timeline.items.shophouse.title"></h3>
          <p class="text-muted" data-i18n="story.timeline.items.shophouse.text"></p>
        </div>
        <div class="timeline__item">
          <p class="timeline__year" data-i18n="story.timeline.items.opened.year"></p>
          <h3 style="margin-block:var(--space-2xs)" data-i18n="story.timeline.items.opened.title"></h3>
          <p class="text-muted" data-i18n="story.timeline.items.opened.text"></p>
        </div>
        <div class="timeline__item">
          <p class="timeline__year" data-i18n="story.timeline.items.michelin.year"></p>
          <h3 style="margin-block:var(--space-2xs)" data-i18n="story.timeline.items.michelin.title"></h3>
          <p class="text-muted" data-i18n="story.timeline.items.michelin.text"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap-narrow">
      <div class="reveal stack" style="--flow:var(--space-m)">
        <p class="eyebrow" data-i18n="story.origins.eyebrow"></p>
        <h2 data-split data-i18n="story.origins.title"></h2>
        <p class="lead" data-i18n="story.origins.body"></p>
        <p data-i18n="story.origins.body2"></p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="split-grid split-grid--center">
        <div class="reveal reveal--left stack" style="--flow:var(--space-m)">
          <p class="eyebrow" data-i18n="story.house.eyebrow"></p>
          <h2 data-split data-i18n="story.house.title"></h2>
          <p class="lead" data-i18n="story.house.body"></p>
          <p data-i18n="story.house.body2"></p>
          <p data-i18n="story.house.body3"></p>
        </div>
        <div><div class="frame" data-reveal-image style="aspect-ratio:3/4">
          <div class="art-placeholder" aria-hidden="true"><span>樓</span></div>
          <img src="../images/venue/upper-floor.jpg" alt="" data-i18n-alt="gallery.items.upperRoom" data-glyph="樓"
               loading="lazy" decoding="async" width="1000" height="1250">
        </div></div>
      </div>
    </div>
  </section>

  <section class="section section--dark">
    <div class="airbrick-bg" aria-hidden="true"></div>
    <div class="wrap-narrow" style="text-align:center">
      <div class="reveal stack" style="--flow:var(--space-m)">
        <p class="eyebrow" style="justify-content:center" data-i18n="story.lineage.eyebrow"></p>
        <h2 data-split data-i18n="story.lineage.title"></h2>
        <p class="lead" style="margin-inline:auto" data-i18n="story.lineage.body"></p>
        <p class="text-sm" style="opacity:.55;margin-block-start:var(--space-m)">
          <span data-legal-name></span><br><span data-registration dir="ltr"></span>
        </p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap-narrow">
      <div class="reveal stack" style="--flow:var(--space-m)">
        <p class="eyebrow" data-i18n="story.kitchen.eyebrow"></p>
        <h2 data-split data-i18n="story.kitchen.title"></h2>
        <p class="lead" data-i18n="story.kitchen.body"></p>
        <p data-i18n="story.kitchen.body2"></p>
        <p class="cluster" style="margin-block-start:var(--space-m)">
          <a class="btn" href="gallery.html" data-magnetic="0.28" data-i18n="common.viewGallery"></a>
          <a class="btn btn--ghost" href="visit.html" data-magnetic="0.28" data-i18n="common.findUs"></a>
        </p>
      </div>
    </div>
  </section>

</main>

</button>
